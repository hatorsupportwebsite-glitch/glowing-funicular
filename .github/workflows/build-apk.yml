name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repository tree
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- all files (max depth 3) ---"
          find . -path ./.git -prune -o -maxdepth 3 -print

      - name: Find Gradle project root
        id: find
        run: |
          FILE=$(find . -name 'settings.gradle*' -not -path './.git/*' -not -path '*/build/*' | head -n1)
          if [ -z "$FILE" ]; then
            echo "::error::settings.gradle.kts not found in the repository. Upload the CONTENTS of the project folder, not the folder itself."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Gradle project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NLShowcase-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
